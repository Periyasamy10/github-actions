name: Self-hosted demo

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  Demo-job:
    runs-on: 
      - terraform
      - demo
    
    steps:
      - name: check current path
        run: pwd

      - name: hostname
        run: hostname
         
      - name: whoami
        run: whoami
      
      - name: create file
        run: touch demo.txt
     
      - name: append contents
        run: echo "Hi This is from workflow" >> demo.txt