name: start-stop-aurora

on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options:
          - start
          - stop
          - single-az-failure
          - two-az-failure
        required: true
      cluster_name:
        type: string
        default: "demo"
      aws_region:
        type: string
        default: "us-east-1"

permissions:
  id-token: write
  contents: read

jobs:
  aurora-start-stop:
    uses: Periyasamy10/github-actions-common-workflows/.github/workflows/aurora-start-stop.yml@main
    with:
      action: ${{ github.event.inputs.action }}
      cluster_name: ${{ github.event.inputs.cluster_name }}
      aws_region: ${{ github.event.inputs.aws_region }}
    secrets: inherit
